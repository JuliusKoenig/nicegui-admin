[project]
name = "niceguitools"
dynamic = ["version"]
description = "Tools for NiceGui."
authors = [
    { name = "Julius Koenig", email = "info@bastelquartier.de" },
]
dependencies = ["nicegui>=3.7.1"]
requires-python = ">=3.10"
readme = "README.md"
keywords = ["nicegui", "gui", "tools", "niceguitools"]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
sqlmodel = [
    "sqlmodel>=0.0.37",
]
[dependency-groups]
dev = [
    "starlette-admin>=0.16.0",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.version]
source = "file"
path = "src/niceguitools/__init__.py"

[tool.pdm.scripts]
push-tags = { shell = "git push origin --tags" }

