[project]
name = "nicegui-admin"
version = "0.1.0.dev0"
description = "A admin Panel besed on NiceGUI."
authors = [
    { name = "Julius Koenig", email = "info@bastelquartier.de" },
]
dependencies = [
    "fastapi-utils[all]>=0.8.0",
    "nicegui>=3.8.0",
]
requires-python = ">=3.10"
readme = "README.md"
keywords = ["nicegui", "gui", "tools", "niceguitools"]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[dependency-groups]
sqlmodel = [
    "sqlalchemy-utils>=0.42.1",
    "sqlmodel>=0.0.37",
]
dev = [
    "pymysql>=1.1.2",
    "pywebview>=6.1",
    "starlette-admin>=0.16.0",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = "all"

